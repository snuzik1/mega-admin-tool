name: CI

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Linux / Python ${{ matrix.python }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python: ["3.8", "3.12", "3.14"]
    env:
      PYTHONUTF8: "1"
      MEGATOOL_HOME: ${{ github.workspace }}/.ci-home
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip

      - name: Установка зависимостей
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Проверка зависимостей
        run: python -m pip check

      - name: Линт (ruff)
        run: ruff check .

      - name: Тесты (pytest, coverage)
        if: matrix.python == '3.12'
        run: pytest --cov=megatool --cov-report=term-missing --cov-fail-under=60

      - name: Тесты (pytest)
        if: matrix.python != '3.12'
        run: pytest

      - name: Проверка запуска
        run: python start.py --version

      - name: Проверка обёртки
        run: bash run.sh --version

      - name: Проверка исполняемых битов
        run: |
          test -x run.sh
          test -x install.sh
          test -x quickstart.sh
          test -x start.py
          test -x scripts/bootstrap.sh
          test -x scripts/install-autostart.sh
          test -x scripts/uninstall-autostart.sh
          test -x scripts/smoke_start.sh
          test -x scripts/startup_matrix.py
          test -x scripts/backup.py
          test -x scripts/restore.py
          test -x scripts/security_audit.sh
          test -x scripts/megatool-agent.py
          test -x scripts/venv_path.py

      - name: Проверка установщика
        run: |
          sh -n install.sh
          sh -n run.sh
          sh -n quickstart.sh
          sh install.sh --help >/dev/null
          sh install.sh --dry-run --system-only >/dev/null

      - name: Проверка quickstart
        run: |
          MEGATOOL_AUTO_INSTALL=0 sh quickstart.sh --version
          git archive --format=tar.gz --prefix=mega-admin-tool-test/ HEAD > "$RUNNER_TEMP/megatool.tar.gz"
          cd "$RUNNER_TEMP"
          cat "$GITHUB_WORKSPACE/quickstart.sh" | \
            MEGATOOL_ARCHIVE_URL="file://$RUNNER_TEMP/megatool.tar.gz" \
            MEGATOOL_INSTALL_DIR="$RUNNER_TEMP/megatool-quickstart" \
            MEGATOOL_AUTO_INSTALL=0 \
            sh -s -- --version
          test -f "$RUNNER_TEMP/megatool-quickstart/.megatool-managed"
          cat "$GITHUB_WORKSPACE/quickstart.sh" | \
            MEGATOOL_INSTALL_DIR="$RUNNER_TEMP/megatool-quickstart" \
            MEGATOOL_AUTO_INSTALL=0 \
            sh -s -- --version

      - name: "Smoke: первый запуск"
        if: matrix.python == '3.12'
        run: bash scripts/smoke_start.sh

      - name: Матрица запуска (Linux-профили)
        if: matrix.python == '3.12'
        run: python scripts/startup_matrix.py

      - name: Синтаксис JavaScript
        run: python scripts/jscheck.py

  security:
    name: Security scan / Python 3.12
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Установка сканеров
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-security.txt

      - name: Bandit (только high)
        run: python -m bandit -q -r megatool scripts -lll

      - name: pip-audit
        run: bash scripts/security_audit.sh

  package:
    name: Wheel / Python 3.12
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Сборка wheel и sdist
        run: |
          python -m pip install --upgrade pip build
          python -m build

      - name: Проверка содержимого wheel
        run: |
          python - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile

          wheels = list(Path("dist").glob("*.whl"))
          assert len(wheels) == 1, wheels
          with ZipFile(wheels[0]) as zf:
              names = set(zf.namelist())

          required = {
              "megatool/auth.py",
              "megatool/api_auth.py",
              "megatool/web/index.html",
              "megatool/web/css/app.css",
              "megatool/web/js/app.js",
              "megatool/web/js/views/settings.js",
              "megatool/web/js/lang/ru/auth.js",
              "megatool/web/js/lang/en/auth.js",
          }
          missing = required - names
          assert not missing, f"В wheel нет: {sorted(missing)}"
          js_count = sum(
              name.startswith("megatool/web/js/") and name.endswith(".js")
              for name in names
          )
          assert js_count >= 50, js_count
          print(f"wheel: {wheels[0].name}, файлов: {len(names)}, JS: {js_count}")
          PY

      - name: Проверка содержимого sdist
        run: |
          python - <<'PY'
          from pathlib import Path
          from tarfile import open as tar_open

          sdist = next(Path("dist").glob("*.tar.gz"))
          with tar_open(sdist) as tf:
              names = {Path(name).name for name in tf.getnames()}

          required = {
              "quickstart.sh",
              "install.sh",
              "run.sh",
              "start.py",
              "requirements.txt",
              "requirements-security.txt",
              "bootstrap.sh",
              "venv_path.py",
              "backup.py",
              "restore.py",
              "security_audit.sh",
              "auth.py",
              "api_auth.py",
              "Dockerfile",
              "ARCHITECTURE.md",
              "index.html",
          }
          missing = required - names
          assert not missing, f"В sdist нет: {sorted(missing)}"
          print(f"sdist: {sdist.name}, файлов: {len(names)}")
          PY

      - name: Установка wheel
        run: |
          python -m venv /tmp/wheel-venv
          /tmp/wheel-venv/bin/python -m pip install --upgrade pip
          /tmp/wheel-venv/bin/python -m pip install dist/*.whl
          cd /tmp
          /tmp/wheel-venv/bin/python - <<'PY'
          from megatool.server import WEB_DIR

          assert "site-packages" in str(WEB_DIR), WEB_DIR
          assert WEB_DIR.is_dir(), WEB_DIR
          assert (WEB_DIR / "index.html").is_file(), WEB_DIR
          print(f"WEB_DIR: {WEB_DIR}")
          PY

  container:
    name: Container / Python 3.12
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Сборка образа
        run: docker build -t megatool:ci .

      - name: Проверка версии в образе
        run: docker run --rm megatool:ci --version

  alpine:
    name: Alpine 3.20 / Python 3.12
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Smoke в чистом Alpine
        run: |
          docker run --rm \
            -v "$PWD:/src" \
            -w /src \
            alpine:3.20 \
            sh -c "sh run.sh --version && MEGATOOL_VENV=/tmp/megatool-install sh install.sh && /tmp/megatool-install/bin/python -c 'import fastapi' && apk add --no-cache curl util-linux && bash scripts/smoke_start.sh"
