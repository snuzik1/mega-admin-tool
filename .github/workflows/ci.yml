name: CI

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Linux / Python ${{ matrix.python }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python: ["3.8", "3.12", "3.14"]
    env:
      PYTHONUTF8: "1"
      MEGATOOL_HOME: ${{ github.workspace }}/.ci-home
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip

      - name: Установка зависимостей
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Проверка зависимостей
        run: python -m pip check

      - name: Линт (ruff)
        run: ruff check .

      - name: Тесты (pytest)
        run: pytest

      - name: Проверка запуска
        run: python start.py --version

      - name: Проверка обёртки
        run: bash run.sh --version

      - name: Матрица запуска (Linux-профили)
        if: matrix.python == '3.12'
        run: python scripts/startup_matrix.py

      - name: Синтаксис JavaScript
        run: python scripts/jscheck.py
