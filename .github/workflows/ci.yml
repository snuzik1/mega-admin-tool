name: CI

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.8", "3.12", "3.14"]
        include:
          - os: macos-latest
            python: "3.12"
          - os: macos-latest
            python: "3.14"
    env:
      PYTHONUTF8: "1"
      MEGATOOL_HOME: ${{ github.workspace }}/.ci-home
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip

      - name: Установка зависимостей
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Проверка зависимостей
        run: python -m pip check

      - name: Линт (ruff)
        run: ruff check .

      - name: Тесты (pytest)
        run: pytest

      - name: Проверка запуска
        run: python start.py --version

      - name: Проверка обёртки Windows
        if: runner.os == 'Windows'
        run: powershell -NoProfile -ExecutionPolicy Bypass -File .\run.ps1 --version

      - name: Проверка обёртки Unix
        if: runner.os != 'Windows'
        run: bash run.sh --version

      - name: Матрица запуска (10 профилей)
        if: matrix.os == 'ubuntu-latest' && matrix.python == '3.12'
        run: python scripts/startup_matrix.py

      - name: Синтаксис JavaScript
        run: python scripts/jscheck.py
