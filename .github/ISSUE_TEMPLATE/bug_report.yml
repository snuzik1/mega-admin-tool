name: Сообщение об ошибке
description: Что-то работает не так, как ожидалось
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Спасибо за отчёт. Не прикладывайте токены агентов, SSH-ключи и
        содержимое `config.json`. Уязвимости отправляйте приватно
        по инструкции в [SECURITY.md](../../SECURITY.md), а не в публичный Issue.

  - type: input
    id: version
    attributes:
      label: Версия MegaTool
      description: Вывод `python -m megatool --version` или версия из README/интерфейса.
      placeholder: "0.7.0"
    validations:
      required: true

  - type: input
    id: python
    attributes:
      label: Версия Python
      placeholder: "3.12.4"
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Шаги воспроизведения
      description: Что вы открыли, нажали и в каком порядке.
      placeholder: |
        1. Запустить ...
        2. Открыть раздел ...
        3. Нажать ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Ожидаемое поведение
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Фактическое поведение
      description: Текст ошибки, статус API и наблюдаемый результат.
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Логи и окружение
      description: |
        При необходимости приложите очищенные логи, `python --version`,
        `docker version`, `kubectl version` и другие relevant сведения.
        Удалите токены и персональные данные.
      render: shell
    validations:
      required: false

  - type: checkboxes
    id: safety
    attributes:
      label: Перед отправкой
      options:
        - label: Я удалил(а) токены, приватные ключи и другие секреты.
          required: true
        - label: Я проверил(а), что это не приватный отчёт об уязвимости.
          required: true
