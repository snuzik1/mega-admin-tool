[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "megatool"
version = "0.6.0"
description = "MegaTool — открытая консоль системного администратора и DevOps (мониторинг, контейнеры, балансировка, конфиги, Ansible, Kubernetes)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "MegaTool contributors" }]
keywords = [
    "sysadmin", "devops", "monitoring", "self-hosted", "docker", "podman",
    "kubernetes", "ansible", "load-balancer", "ssh", "vanilla-js",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Web Environment",
    "Framework :: FastAPI",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: MIT License",
    "Natural Language :: English",
    "Natural Language :: Russian",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: System :: Monitoring",
    "Topic :: System :: Systems Administration",
]
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "websockets>=12",
    "psutil>=5.9",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "httpx>=0.27", "ruff>=0.6", "esprima>=4.0"]

[project.scripts]
megatool = "megatool.__main__:main"

[tool.setuptools]
packages = ["megatool", "megatool.lang"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
target-version = "py310"
line-length = 120
exclude = [".venv", "venv", "build", "dist", "runs"]

[tool.ruff.lint]
# Консервативный набор: синтаксические ошибки и неопределённые имена.
# Полный линт проекта — отдельная задача, чтобы не шуметь на легаси-коде.
select = ["E9", "F63", "F7", "F82"]
