[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "megatool"
version = "0.7.0"
description = "MegaTool — открытая консоль системного администратора и DevOps (мониторинг, контейнеры, балансировка, конфиги, Ansible, Kubernetes)"
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
authors = [{ name = "MegaTool contributors" }]
keywords = [
    "sysadmin", "devops", "monitoring", "self-hosted", "docker", "podman",
    "kubernetes", "ansible", "load-balancer", "ssh", "vanilla-js",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Web Environment",
    "Framework :: FastAPI",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: MIT License",
    "Natural Language :: English",
    "Natural Language :: Russian",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: System :: Monitoring",
    "Topic :: System :: Systems Administration",
]
dependencies = [
    "fastapi>=0.115,<0.117",
    "uvicorn>=0.30,<0.34",
    "websockets>=12,<14",
    "psutil>=5.9,<8",
    "PyYAML>=6.0,<7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<8.4",
    "httpx>=0.27,<0.29",
    "ruff>=0.6",
    "esprima>=4.0,<5",
    "build>=1.2,<2",
]

[project.scripts]
megatool = "megatool.__main__:main"

[project.urls]
Homepage = "https://github.com/snuzik1/mega-admin-tool"
Repository = "https://github.com/snuzik1/mega-admin-tool"
Issues = "https://github.com/snuzik1/mega-admin-tool/issues"
Changelog = "https://github.com/snuzik1/mega-admin-tool/blob/main/CHANGELOG.md"

[tool.setuptools.packages.find]
include = ["megatool*"]
namespaces = true

[tool.setuptools.package-data]
megatool = [
    "web/index.html",
    "web/css/*.css",
    "web/js/*.js",
    "web/js/lang/*/*.js",
    "web/js/views/*.js",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
target-version = "py38"
line-length = 120
exclude = [".venv", "venv", "build", "dist", "runs"]

[tool.ruff.lint]
# Консервативный набор: синтаксические ошибки и неопределённые имена.
# Полный линт проекта — отдельная задача, чтобы не шуметь на легаси-коде.
select = ["E9", "F63", "F7", "F82"]
